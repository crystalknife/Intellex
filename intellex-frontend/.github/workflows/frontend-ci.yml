name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "Dockerfile"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

      - name: Build Docker image
        # Validates the Dockerfile builds cleanly. Not pushed anywhere
        # yet -- no registry/hosting platform has been chosen (see
        # project roadmap notes). Add a push step here once one is.
        working-directory: .
        run: docker build -t intellex-frontend:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 .
